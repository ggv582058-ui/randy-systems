name: Randy SYSTEMS checks
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  syntax-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: npm run check
      - name: Run unit tests
        run: npm test
